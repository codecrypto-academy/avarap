version: '3.8'

services:
  anvil:
    image: ghcr.io/foundry-rs/foundry:latest
    container_name: supply-chain-anvil
    ports:
      - "8545:8545"
    command: anvil --host 0.0.0.0 --chain-id 31337
    networks:
      - blockchain-network

  foundry:
    image: ghcr.io/foundry-rs/foundry:latest
    container_name: supply-chain-foundry
    working_dir: /app
    volumes:
      - ./sc:/app
    networks:
      - blockchain-network
    depends_on:
      - anvil
    profiles:
      - tools

networks:
  blockchain-network:
    driver: bridge
